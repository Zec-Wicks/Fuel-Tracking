name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install in editable mode
        run: |
          python -m pip install -U pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest

      - name: Smoke test CLI on example data
        run: |
          fueltrack --help
          fueltrack data.example.csv --out outputs
